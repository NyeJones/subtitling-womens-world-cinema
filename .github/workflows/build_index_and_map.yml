name:  Build Film Indexes and Map

on:
  push:
    paths:
      - 'data/**'
      - 'index_builder/*.py'
      - 'index_builder/static/**'
      - 'map_builder/*.py'
      - 'map_builder/static/**'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout full history
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2. Set up Python 
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          pip install pandas numpy Unidecode folium

      # 4. Build index
      - name: Build index
        run: python index_builder/build_index.py

      # 5. Build map
      - name: Build map
        run: python map_builder/build_map.py

      # 6. Merge map into index build folder
      - name: Merge map into build folder
        run: |
          mkdir -p index_builder/build/map
          cp map_builder/map.html index_builder/build/map/
          cp map_builder/search_data.json index_builder/build/map/
          cp map_builder/screening_data.json index_builder/build/map/

      # 7. Deploy all outputs to generated branch
      - name: Deploy to generated branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./index_builder/build
          publish_branch: generated
