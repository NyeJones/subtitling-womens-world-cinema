name: Copy Film Indexes

on:
  workflow_run:
    workflows: ["Build Film Indexes"]
    types:
      - completed

permissions:
  contents: write

jobs:
  copy-indexes:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # 1. Checkout site branch
      - name: Checkout site branch
        uses: actions/checkout@v4
        with:
          ref: site
          fetch-depth: 0

      # 2. Fetch generated branch
      - name: Fetch generated branch
        run: |
          git fetch origin generated

          echo "=== GENERATED BRANCH ==="
          git log -1 --oneline origin/generated

          echo
          echo "=== FILES ON GENERATED BRANCH ==="
          git ls-tree -r --name-only origin/generated

      # 3. Copy generated content
      - name: Copy generated content
        run: |
          mkdir -p docs/indexes

          echo "=== INDEXES BEFORE COPY ==="
          find docs/indexes -type f -print || true

          find docs/indexes -type f ! -name ".gitignore" -delete

          git worktree add gen origin/generated

          echo
          echo "=== FILES IN GEN ==="
          find gen -type f -print

          echo
          echo "=== COPYING ==="
          rsync -av gen/ docs/indexes/

          echo
          echo "=== FILES IN DOCS/INDEXES AFTER COPY ==="
          find docs/indexes -type f -print

          rm -rf gen

      # 4. Commit and push changes
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          echo "=== GIT STATUS ==="
          git status --short

          echo
          echo "=== DOCS/INDEXES STATUS ==="
          git status --short docs/indexes

          git add docs

          echo
          echo "=== STAGED CHANGES ==="
          git diff --cached --stat
          git diff --cached --name-only

          git commit -m "Auto-update film indexes" || echo "No changes to commit"
          git push origin site