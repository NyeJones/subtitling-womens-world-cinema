name: Copy Film Indexes

on:
  workflow_run:
    workflows: ["Build Film Indexes"]
    types:
      - completed

permissions:
  contents: write

jobs:
  copy-indexes:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # 1. Checkout site branch
      - name: Checkout site branch
        uses: actions/checkout@v4
        with:
          ref: site
          fetch-depth: 0

      # 2. Fetch generated branch
      - name: Fetch generated branch
        run: git fetch origin generated

      # 3. Copy generated content
    - name: Copy generated content
      run: |
        mkdir -p docs/indexes

        find docs/indexes -type f ! -name ".gitignore" -delete
        rm -rf docs/indexes/.git

        git worktree add gen origin/generated

        rsync -av --exclude='.git' gen/ docs/indexes/

        rm -rf docs/indexes/.git

        echo "=== FINAL INDEX FILES ==="
        find docs/indexes -type f -print

        git worktree remove gen --force

      # 4. Commit and push changes
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs
          git commit -m "Auto-update film indexes" || echo "No changes to commit"
          git push origin site