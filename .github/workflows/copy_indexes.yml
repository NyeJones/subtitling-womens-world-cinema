name: Copy Film Indexes

on:
  workflow_run:
    workflows: ["Build Film Indexes"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-indexes:
    runs-on: ubuntu-latest

    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout site branch
        uses: actions/checkout@v4
        with:
          ref: site
          fetch-depth: 0

      - name: Fetch generated branch
        run: git fetch origin generated

      - name: Copy generated indexes
        run: |
          mkdir -p docs/indexes

          find docs/indexes -type f ! -name ".gitignore" -delete

          git worktree add --detach gen origin/generated

          test -f gen/film_index.html
          test -f gen/search_index.json

          rsync -av --exclude='.git' gen/ docs/indexes/

          git worktree remove gen --force

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A docs/indexes

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto-update film indexes"
          git push origin site
