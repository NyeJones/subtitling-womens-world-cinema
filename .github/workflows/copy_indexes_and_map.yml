name: Copy Film Indexes and Map

on:
  workflow_run:
    workflows: ["Build Film Indexes and Map"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-indexes:
    runs-on: ubuntu-latest

    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      # 1. Checkout site branch (where the site lives)
      - name: Checkout site branch
        uses: actions/checkout@v4
        with:
          ref: site
          fetch-depth: 0

      # 2. Fetch generated branch
      - name: Fetch generated branch
        run: git fetch origin generated

      # 3. Copy indexes
      - name: Copy generated indexes
        run: |
          mkdir -p docs/indexes

          find docs/indexes -type f ! -name ".gitignore" -delete

          git worktree add --detach gen origin/generated

          rsync -av --exclude='.git' --exclude='map/' gen/ docs/indexes/

          cp gen/map/map.html docs/map.html
          cp gen/map/search_data.json docs/search_data.json

          git worktree remove gen --force

      # 4. Commit and push changes
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

           git add -A docs/indexes docs/map.html

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto-update film indexes and map"
          git push origin site
